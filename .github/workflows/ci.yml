name: CI

# The tests run on every push and on every pull request. There are no
# secrets here: the backend and the frontend are tested on their own, and
# neither needs a running pool or a real Claude Code session.

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The runner already has the right python, so the requirements go
      # straight into it instead of through `make venv`.
      - name: install the backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: run the backend tests
        run: pytest tests -q

  frontend:
    name: frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: install the frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: run the frontend tests
        working-directory: frontend
        run: npm test
